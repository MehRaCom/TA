<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Assigner</title>
<link rel="icon" type="image/png" href="taskAssigner_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     EDIT THIS BLOCK TO CONFIGURE COLORS
     ===================================================================== */
  :root {
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  html[data-theme="dark"] {
    --bg: #1c1c1f;
    --panel: #26262b;
    --border: #3a3a40;
    --text: #eaeaef;
    --muted: #83838c;
    --accent: #ff9e42;
    --accent-soft: rgba(255, 158, 66, 0.14);
    --btn-bg: #3f7bff;
    --btn-fg: #ffffff;
    --danger: #ff6b6b;
    --success: #58d68d;
    --rotation-accent: #ff5c5c;
    --rotation-accent-soft: rgba(255, 92, 92, 0.14);
  }
  html[data-theme="light"] {
    --bg: #f5f4f1;
    --panel: #ffffff;
    --border: #dcdad5;
    --text: #24231f;
    --muted: #93918b;
    --accent: #cc4d0d;
    --accent-soft: rgba(204, 77, 13, 0.10);
    --btn-bg: #2f6fed;
    --btn-fg: #ffffff;
    --danger: #c0392b;
    --success: #2e9e5b;
    --rotation-accent: #d1392e;
    --rotation-accent-soft: rgba(209, 57, 46, 0.08);
  }
  /* ===================================================================== */

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    transition: background 0.2s ease, color 0.2s ease;
    min-height: 100vh;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 20px 40px;
  }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand img { width: 34px; height: 34px; display: block; }
  .brand h1 {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .theme-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .theme-toggle button {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 14px;
    font-family: var(--font-body);
    font-size: 0.85rem;
    cursor: pointer;
  }
  .theme-toggle button:hover { border-color: var(--accent); }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 16px;
  }
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .panel h2 {
    font-family: var(--font-display);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 12px;
  }

  label.check {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 4px;
    font-size: 0.94rem;
    cursor: pointer;
    border-radius: 8px;
  }
  label.check:hover { background: var(--accent-soft); }
  label.check input {
    width: 17px;
    height: 17px;
    flex-shrink: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .task-row {
    display: grid;
    grid-template-columns: 1fr 22px 1fr;
    align-items: center;
    gap: 6px;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
  }
  .task-row:last-child { border-bottom: none; }

  .task-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .task-left label.check { padding: 0; flex: 1; min-width: 0; gap: 8px; }
  .task-icon {
    font-size: 1.05rem;
    line-height: 1;
    flex-shrink: 0;
    width: 1.3em;
    text-align: center;
  }
  .task-left label.check span.name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .weight-chip {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 6px;
    padding: 2px 6px;
    flex-shrink: 0;
  }
  .connector {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .result-box {
    font-size: 0.9rem;
    padding: 4px 8px;
    border-radius: 8px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .result-box.filled {
    color: var(--accent);
    font-weight: 600;
    background: var(--accent-soft);
  }

  /* Below 600px, three squeezed columns is what was truncating task names
     and results. Stack each row instead: full-width task line, then a
     full-width result line right under it -- both get their full text. */
  @media (max-width: 600px) {
    .task-row {
      grid-template-columns: 1fr;
      row-gap: 4px;
      padding: 10px 4px;
    }
    .connector { display: none; }
    .task-left label.check span.name {
      overflow: visible;
      text-overflow: unset;
      white-space: normal;
      word-break: break-word;
    }
    .result-box {
      overflow: visible;
      text-overflow: unset;
      white-space: normal;
      word-break: break-word;
    }
    .result-box::before {
      content: "→ ";
      color: var(--muted);
    }
    .result-box.filled::before {
      color: var(--accent);
    }
  }

  footer.actions {
    margin-top: 18px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  button.primary, button.secondary {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.92rem;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    cursor: pointer;
  }
  button.primary {
    background: var(--btn-bg);
    color: var(--btn-fg);
  }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.secondary:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }

  #status {
    font-size: 0.85rem;
    color: var(--muted);
  }
  #status.ok { color: var(--success); }
  #status.err { color: var(--danger); }
  #status.info { color: var(--accent); }

  #notifyAnywayBtn {
    display: none;
  }
  #notifyAnywayBtn.show {
    display: inline-block;
  }

  .rotation-toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--rotation-accent);
    background: var(--rotation-accent-soft);
    border: 1.5px solid var(--rotation-accent);
    border-radius: 10px;
    padding: 11px 12px !important;
    margin-bottom: 14px;
  }
  label.check.rotation-toggle:hover {
    background: var(--rotation-accent-soft);
  }
  .rotation-toggle input[type="checkbox"] {
    accent-color: var(--rotation-accent);
  }
  .task-row.fixed-locked {
    opacity: 0.6;
  }
  .task-row.fixed-locked .task-left label.check {
    cursor: not-allowed;
  }
  .task-row.fixed-locked input[type="checkbox"] {
    cursor: not-allowed;
  }
  label.check.fixed-locked {
    opacity: 0.6;
  }
  label.check.fixed-locked input[type="checkbox"] {
    cursor: not-allowed;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <img src="taskAssigner_icon.png" alt="">
      <h1>Task Assigner</h1>
    </div>
    <div class="theme-toggle">
      <span>Theme</span>
      <button id="themeBtn" type="button">Toggle</button>
    </div>
  </header>

  <div class="grid">
    <section class="panel">
      <h2>People</h2>
      <div id="peopleList"></div>
    </section>

    <section class="panel">
      <h2>Tasks &nbsp;/&nbsp; Assigned to</h2>
      <label class="check rotation-toggle" id="rotationToggleLabel">
        <input type="checkbox" id="rotationToggle">
        <span id="rotationToggleText">Use fixed rotation schedule</span>
      </label>
      <div id="taskList"></div>
    </section>
  </div>

  <footer class="actions">
    <button class="primary" id="assignBtn" type="button">Assign</button>
    <button class="secondary" id="notifyAnywayBtn" type="button">Notify group anyway</button>
    <span id="status"></span>
  </footer>

</div>

<script>
/* =============================================================================
   PEOPLE, TASKS, TASK_COLORS, and FIXED_SCHEDULES are no longer hardcoded
   here -- they're fetched from the Worker's central config (see
   worker/config.js), which is edited via admin.html. This is populated by
   init() below, before anything else runs. Only WORKER_URL and the a few
   local-only settings stay as plain constants.
   ============================================================================= */

let PEOPLE = [];
let TASKS = [];
let TASK_COLORS = {};
let FIXED_SCHEDULES = {};


// The Cloudflare Worker URL from `wrangler deploy` (see README.md).
// This is safe to be public -- it's just an address, not a secret. The
// actual bot token lives server-side in the Worker's environment, never
// here.
// const WORKER_URL = "https://REPLACE-ME.workers.dev";
const WORKER_URL = "https://task-assigner-telegram.mehra-co.workers.dev";

const DEFAULT_DARK_MODE = true;
const CONFIG_STORAGE_KEY = "taskAssignerConfig";

/* ============================================================================= */

let isDark = DEFAULT_DARK_MODE;

// --------------------------------------------------------------------- Config
function buildDefaultConfig() {
  return {
    darkMode: DEFAULT_DARK_MODE,
    useFixedRotation: false,
    people: PEOPLE.map(p => ({ name: p.name, enabled: p.defaultEnabled })),
    tasks: TASKS.map(t => ({ name: t.name, enabled: t.defaultEnabled, weight: t.weight })),
  };
}

function configIsValid(cfg) {
  if (!cfg || typeof cfg !== "object") return false;
  if (!Array.isArray(cfg.people) || !Array.isArray(cfg.tasks)) return false;
  if (typeof cfg.darkMode !== "boolean") return false;
  if (typeof cfg.useFixedRotation !== "boolean") return false;
  if (cfg.people.length !== PEOPLE.length || cfg.tasks.length !== TASKS.length) return false;
  for (let i = 0; i < PEOPLE.length; i++) {
    const p = cfg.people[i];
    if (!p || p.name !== PEOPLE[i].name || typeof p.enabled !== "boolean") return false;
  }
  for (let i = 0; i < TASKS.length; i++) {
    const t = cfg.tasks[i];
    if (!t || t.name !== TASKS[i].name || typeof t.enabled !== "boolean") return false;
    if (typeof t.weight !== "number" || !(t.weight > 0)) return false;
  }
  return true;
}

function loadOrInitConfig() {
  let cfg = null;
  try {
    const raw = localStorage.getItem(CONFIG_STORAGE_KEY);
    if (raw) cfg = JSON.parse(raw);
  } catch (e) {
    cfg = null;
  }
  if (!configIsValid(cfg)) {
    cfg = buildDefaultConfig();
    saveConfig(cfg);
  }
  return cfg;
}

function saveConfig(cfg) {
  try {
    localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify(cfg));
  } catch (e) {
    // Non-fatal (e.g. private browsing mode blocking storage) -- the
    // app still works, it just won't remember state next time.
  }
}

function currentConfigFromUI() {
  return {
    darkMode: isDark,
    useFixedRotation: useFixedRotation,
    people: PEOPLE.map((p, i) => {
      const isLocked = personChecks[i].disabled;
      const enabled = isLocked
        ? (fixedLockedPersonPriorState[p.name] ?? personChecks[i].checked)
        : personChecks[i].checked;
      return { name: p.name, enabled };
    }),
    tasks: TASKS.map((t, i) => ({ name: t.name, enabled: taskChecks[i].checked, weight: taskWeights[i] })),
  };
}

function persistCurrentConfig() {
  saveConfig(currentConfigFromUI());
}

// --------------------------------------------------------------------- Build UI
// config/useFixedRotation/taskWeights are populated inside init() below,
// once PEOPLE/TASKS have actually been fetched from the server.
let config = null;
let useFixedRotation = false;
let taskWeights = [];

function tehranWeekdayName(date) {
  return new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Tehran", weekday: "long" }).format(date);
}

const personChecks = [];
const personRowEls = [];
const taskChecks = [];
const resultBoxes = [];
const taskRowEls = [];

// Remembers each fixed-rotation person's REAL checkbox preference while
// their checkbox is forced on/locked -- without this, persisting config
// while they're locked would overwrite their true preference with the
// temporary forced value. Populated/cleared in applyFixedRotationUI.
let fixedLockedPersonPriorState = {};

function buildPeopleList() {
  const container = document.getElementById("peopleList");
  PEOPLE.forEach((p, i) => {
    const label = document.createElement("label");
    label.className = "check";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = config.people[i].enabled;
    input.addEventListener("change", persistCurrentConfig);
    const span = document.createElement("span");
    span.textContent = p.name;
    label.appendChild(input);
    label.appendChild(span);
    container.appendChild(label);
    personChecks.push(input);
    personRowEls.push(label); // the label itself is the "row" for people
  });
}

function buildTaskList() {
  const container = document.getElementById("taskList");
  TASKS.forEach((t, i) => {
    const row = document.createElement("div");
    row.className = "task-row";

    const color = TASK_COLORS[t.name] || null;

    const left = document.createElement("div");
    left.className = "task-left";
    const label = document.createElement("label");
    label.className = "check";
    const iconSpan = document.createElement("span");
    iconSpan.className = "task-icon";
    iconSpan.textContent = t.icon || "•";
    if (color) {
      iconSpan.style.background = color + "26"; // ~15% alpha badge
      iconSpan.style.borderRadius = "6px";
    }
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = config.tasks[i].enabled;
    input.addEventListener("change", persistCurrentConfig);
    const span = document.createElement("span");
    span.className = "name";
    span.textContent = t.name;
    if (color) span.style.color = color;
    label.appendChild(input);
    label.appendChild(iconSpan);
    label.appendChild(span);
    const chip = document.createElement("span");
    chip.className = "weight-chip";
    chip.textContent = "×" + taskWeights[i];
    if (color) {
      chip.style.color = color;
      chip.style.background = color + "22";
    }
    left.appendChild(label);
    left.appendChild(chip);

    const connector = document.createElement("div");
    connector.className = "connector";
    connector.textContent = "→";

    const result = document.createElement("div");
    result.className = "result-box";
    result.textContent = "-- not assigned --";

    row.appendChild(left);
    row.appendChild(connector);
    row.appendChild(result);
    container.appendChild(row);


    taskChecks.push(input);
    resultBoxes.push(result);
    taskRowEls.push(row);
  });
}

// --------------------------------------------------------------- Fixed rotation
// Enforces the mutual exclusion for EVERY task that has a fixed schedule
// entry (not just one hardcoded task): while the rotation is on, each
// such task's own checkbox is locked off (forced unchecked, disabled)
// since there's nothing left for the user to decide about it. Also fills
// in a same-page PREVIEW of who that resolves to today, purely for
// display -- the actual authoritative resolution happens server-side
// when Assign is clicked (see worker/telegram-worker.js).
function applyFixedRotationUI() {
  const weekday = tehranWeekdayName(new Date());

  TASKS.forEach((t, i) => {
    const schedule = FIXED_SCHEDULES[t.name];
    if (!schedule) return; // this task has no fixed schedule -- untouched

    const checkbox = taskChecks[i];
    const result = resultBoxes[i];
    const color = TASK_COLORS[t.name] || null;

    if (useFixedRotation) {
      const person = schedule[weekday];

      // Reflect reality: checked when someone is actually covering this
      // task today via the rotation, unchecked only when today genuinely
      // has no one assigned (e.g. a day left blank in admin.html). Either
      // way it's locked -- the user can't override it manually while
      // rotation is on, only see what's actually happening.
      checkbox.checked = !!person;
      checkbox.disabled = true;
      taskRowEls[i].classList.add("fixed-locked");

      if (person) {
        result.textContent = person + " (rotation)";
        result.classList.add("filled");
        if (color) result.style.color = color;
      } else {
        result.textContent = "no rotation today";
        result.classList.remove("filled");
        result.style.color = "";
      }
    } else {
      checkbox.disabled = false;
      taskRowEls[i].classList.remove("fixed-locked");
      // Restore whatever the saved config says for this task's own checkbox
      checkbox.checked = config.tasks[i].enabled;
      result.textContent = "-- not assigned --";
      result.classList.remove("filled");
      result.style.color = "";
    }
  });

  // ---- People: force-include and lock whoever today's rotation covers ----
  // This is the fix for the dedupe-bypass bug: if a rotation person's
  // People checkbox could be freely unticked, that changed the day's
  // "configuration" fingerprint and let someone force a fresh reroll by
  // simply excluding them. Locking them ON here closes that off, and also
  // guarantees the "seed their workload" fairness behavior always applies
  // instead of only when the user happened to leave them ticked.
  const lockedPersonNames = new Set();
  if (useFixedRotation) {
    for (const taskName of Object.keys(FIXED_SCHEDULES)) {
      const person = FIXED_SCHEDULES[taskName][weekday];
      if (person) lockedPersonNames.add(person);
    }
  }

  PEOPLE.forEach((p, i) => {
    const checkbox = personChecks[i];
    const row = personRowEls[i];

    if (lockedPersonNames.has(p.name)) {
      if (!(p.name in fixedLockedPersonPriorState)) {
        fixedLockedPersonPriorState[p.name] = checkbox.checked; // remember real preference, once
      }
      checkbox.checked = true;
      checkbox.disabled = true;
      row.classList.add("fixed-locked");
      row.title = "Included today: part of the fixed rotation";
    } else if (checkbox.disabled) {
      // Was locked before, now unlocking -- restore their real preference
      checkbox.checked = fixedLockedPersonPriorState[p.name] ?? checkbox.checked;
      delete fixedLockedPersonPriorState[p.name];
      checkbox.disabled = false;
      row.classList.remove("fixed-locked");
      row.title = "";
    }
  });
}

const rotationToggle = document.getElementById("rotationToggle");
rotationToggle.addEventListener("change", () => {
  useFixedRotation = rotationToggle.checked;
  applyFixedRotationUI();
  persistCurrentConfig();
});

// --------------------------------------------------------------------- Theming
function applyTheme() {
  document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
}
document.getElementById("themeBtn").addEventListener("click", () => {
  isDark = !isDark;
  applyTheme();
  persistCurrentConfig();
});
// Apply a reasonable default theme immediately, so the page doesn't flash
// the wrong theme while waiting on the config fetch below -- init() will
// correct it to the real saved preference once loaded.
isDark = DEFAULT_DARK_MODE;
applyTheme();

// --------------------------------------------------------------------- Init
// Fetches the central config from the Worker (people, tasks, colors,
// icons, fixed rotation) BEFORE building anything -- this is what
// replaces the old hardcoded PEOPLE/TASKS/FIXED_SCHEDULES arrays. See
// worker/config.js and admin.html for where this data actually lives and
// how it's edited.
//
// Stale-while-revalidate: if a previous visit's config is cached in
// localStorage, render from it IMMEDIATELY (no network wait at all) and
// refresh the cache silently in the background for next time. This never
// touches the already-rendered UI mid-session -- a background refresh
// only updates what's used on the NEXT load, so it can't yank a
// checkbox out from under someone mid-interaction. First-ever visit (no
// cache yet) falls back to waiting on the network, same as before.
const SERVER_CONFIG_CACHE_KEY = "taskAssignerServerConfigCache";

function readCachedServerConfig() {
  try {
    const raw = localStorage.getItem(SERVER_CONFIG_CACHE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.people) || !Array.isArray(parsed.tasks)) return null;
    return parsed;
  } catch (e) {
    return null;
  }
}

function writeCachedServerConfig(serverCfg) {
  try {
    localStorage.setItem(SERVER_CONFIG_CACHE_KEY, JSON.stringify(serverCfg));
  } catch (e) {
    // Non-fatal (e.g. private browsing) -- just means next load waits on
    // the network again instead of rendering instantly from cache.
  }
}

async function fetchServerConfig() {
  const resp = await fetch(WORKER_URL + "/config");
  if (!resp.ok) throw new Error("Failed to load configuration (" + resp.status + ")");
  return await resp.json();
}

function applyServerConfig(serverCfg) {
  PEOPLE = (serverCfg.people || []).map(p => ({ name: p.name, defaultEnabled: p.defaultEnabled }));
  TASKS = (serverCfg.tasks || []).map(t => ({ name: t.name, weight: t.weight, defaultEnabled: t.defaultEnabled, icon: t.icon }));
  TASK_COLORS = {};
  (serverCfg.tasks || []).forEach(t => { if (t.color) TASK_COLORS[t.name] = t.color; });
  FIXED_SCHEDULES = serverCfg.fixedSchedules || {};
  return PEOPLE.length > 0 && TASKS.length > 0;
}

function buildUIFromCurrentConfig() {
  config = loadOrInitConfig();
  isDark = config.darkMode;
  useFixedRotation = config.useFixedRotation;
  taskWeights = TASKS.map((t, i) => config.tasks[i].weight);

  buildPeopleList();
  buildTaskList();

  rotationToggle.checked = useFixedRotation;
  const fixedTaskNames = Object.keys(FIXED_SCHEDULES);
  document.getElementById("rotationToggleText").textContent = fixedTaskNames.length > 0
    ? "Use fixed rotation for: " + fixedTaskNames.join(", ")
    : "Use fixed rotation (none configured yet)";
  applyFixedRotationUI();
  applyTheme();
}

async function init() {
  const assignBtn = document.getElementById("assignBtn");
  assignBtn.disabled = true;

  if (WORKER_URL.includes("REPLACE-ME")) {
    setStatus("Set WORKER_URL in index.html first (see README).", "err");
    return;
  }

  const cached = readCachedServerConfig();
  if (cached && applyServerConfig(cached)) {
    // Instant render from cache -- no network wait for this page view.
    buildUIFromCurrentConfig();
    assignBtn.disabled = false;
    setStatus("", "");

    // Refresh silently in the background for NEXT load. Deliberately
    // does not touch PEOPLE/TASKS/the live DOM again this session.
    fetchServerConfig().then(writeCachedServerConfig).catch(() => {
      // Non-fatal -- next load just tries the network again.
    });
    return;
  }

  // No usable cache yet (first-ever visit, or private browsing) -- fall
  // back to waiting on the network before rendering anything.
  setStatus("Loading configuration…", "info");
  let serverCfg;
  try {
    serverCfg = await fetchServerConfig();
  } catch (err) {
    setStatus("Could not load configuration: " + err.message, "err");
    return;
  }

  if (!applyServerConfig(serverCfg)) {
    setStatus("Server returned an empty configuration -- check admin.html.", "err");
    return;
  }
  writeCachedServerConfig(serverCfg);

  buildUIFromCurrentConfig();

  setStatus("", "");
  assignBtn.disabled = false;
}

init();

// --------------------------------------------------------------------- Algorithm
// NOTE: the actual weighted-balancing algorithm now runs on the SERVER
// (the Worker), not here. This keeps randomness out of the client's

// hands entirely -- the browser only ever sends the current
// configuration (who/what is ticked) and displays whatever the server
// decides, whether that's a freshly generated assignment or an already-
// existing one for today (Tehran time).

let lastServerResult = null; // { status, assignment, generatedAt, tehranDate }

function clearResultBoxes() {
  resultBoxes.forEach(box => {
    box.textContent = "-- not assigned --";
    box.classList.remove("filled");
    box.style.color = "";
  });
}

function renderAssignment(assignment) {
  clearResultBoxes();
  const byTask = new Map(assignment.map(r => [r.task, r]));
  TASKS.forEach((t, i) => {
    const entry = byTask.get(t.name);
    if (entry) {
      resultBoxes[i].textContent = entry.person + (entry.fixed ? " (rotation)" : "");
      resultBoxes[i].classList.add("filled");
      const color = TASK_COLORS[t.name];
      if (color) resultBoxes[i].style.color = color;
    }
  });
}

function formatTehranTime(isoString) {
  try {
    return new Date(isoString).toLocaleTimeString("en-GB", {
      timeZone: "Asia/Tehran", hour: "2-digit", minute: "2-digit",
    });
  } catch (e) {
    return isoString;
  }
}

async function callAssignEndpoint(forceNotify) {
  const enabledPeopleNames = PEOPLE
    .map((p, i) => ({ name: p.name, enabled: personChecks[i].checked }))
    .filter(p => p.enabled)
    .map(p => p.name);

  const enabledTasksPayload = TASKS.map((t, i) => ({
    name: t.name,
    weight: taskWeights[i],
    enabled: taskChecks[i].checked,
  }));

  if (enabledPeopleNames.length === 0) {
    setStatus("Select at least one person.", "err");
    return null;
  }
  if (!enabledTasksPayload.some(t => t.enabled)) {
    setStatus("Select at least one task.", "err");
    return null;
  }
  if (WORKER_URL.includes("REPLACE-ME")) {
    setStatus("Set WORKER_URL in index.html first (see README).", "err");
    return null;
  }

  const payload = {
    people: PEOPLE.map((p, i) => ({ name: p.name, enabled: personChecks[i].checked })),
    tasks: enabledTasksPayload,
    forceNotify: !!forceNotify,
    useFixedRotation: useFixedRotation,
  };

  const resp = await fetch(WORKER_URL + "/assign", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  const data = await resp.json();
  if (!resp.ok) {
    throw new Error(data.error || ("Request failed: " + resp.status));
  }
  return data;
}

async function onAssignClicked() {
  const assignBtn = document.getElementById("assignBtn");
  const notifyBtn = document.getElementById("notifyAnywayBtn");
  notifyBtn.classList.remove("show");
  assignBtn.disabled = true;
  setStatus("Checking today's assignments…", "info");

  try {
    const data = await callAssignEndpoint(false);
    if (!data) { assignBtn.disabled = false; return; }

    lastServerResult = data;
    renderAssignment(data.assignment);

    if (data.status === "new") {
      setStatus("New assignment generated and sent to the group.", "ok");
    } else if (data.status === "repeat") {
      const when = formatTehranTime(data.generatedAt);
      setStatus(
        `This exact combination was already assigned today at ${when} (Tehran time) -- showing that result. Not sent again.`,
        "info"
      );
      notifyBtn.classList.add("show");
    }
  } catch (err) {
    setStatus("Failed: " + err.message, "err");
  } finally {
    assignBtn.disabled = false;
  }
}

async function onNotifyAnywayClicked() {
  const notifyBtn = document.getElementById("notifyAnywayBtn");
  notifyBtn.disabled = true;
  setStatus("Posting reminder to the group…", "info");
  try {
    const data = await callAssignEndpoint(true);
    if (!data) { notifyBtn.disabled = false; return; }
    lastServerResult = data;
    renderAssignment(data.assignment);
    setStatus("Reminder posted to the group.", "ok");
    notifyBtn.classList.remove("show");
  } catch (err) {
    setStatus("Failed: " + err.message, "err");
  } finally {
    notifyBtn.disabled = false;
  }
}

document.getElementById("assignBtn").addEventListener("click", onAssignClicked);
document.getElementById("notifyAnywayBtn").addEventListener("click", onNotifyAnywayClicked);

function setStatus(msg, kind) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = kind || "";
}
</script>
</body>
</html>
