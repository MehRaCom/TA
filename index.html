<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Assigner</title>
<link rel="icon" type="image/png" href="taskAssigner_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     EDIT THIS BLOCK TO CONFIGURE COLORS
     ===================================================================== */
  :root {
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  html[data-theme="dark"] {
    --bg: #1c1c1f;
    --panel: #26262b;
    --border: #3a3a40;
    --text: #eaeaef;
    --muted: #83838c;
    --accent: #ff9e42;
    --accent-soft: rgba(255, 158, 66, 0.14);
    --btn-bg: #3f7bff;
    --btn-fg: #ffffff;
    --danger: #ff6b6b;
    --success: #58d68d;
    --rotation-accent: #ff5c5c;
    --rotation-accent-soft: rgba(255, 92, 92, 0.14);
  }
  html[data-theme="light"] {
    --bg: #f5f4f1;
    --panel: #ffffff;
    --border: #dcdad5;
    --text: #24231f;
    --muted: #93918b;
    --accent: #cc4d0d;
    --accent-soft: rgba(204, 77, 13, 0.10);
    --btn-bg: #2f6fed;
    --btn-fg: #ffffff;
    --danger: #c0392b;
    --success: #2e9e5b;
    --rotation-accent: #d1392e;
    --rotation-accent-soft: rgba(209, 57, 46, 0.08);
  }
  /* ===================================================================== */

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    transition: background 0.2s ease, color 0.2s ease;
    min-height: 100vh;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 28px 20px 40px;
  }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand img { width: 34px; height: 34px; display: block; }
  .brand h1 {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .theme-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .theme-toggle button {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 14px;
    font-family: var(--font-body);
    font-size: 0.85rem;
    cursor: pointer;
  }
  .theme-toggle button:hover { border-color: var(--accent); }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 16px;
  }
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .panel h2 {
    font-family: var(--font-display);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 12px;
  }

  label.check {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 4px;
    font-size: 0.94rem;
    cursor: pointer;
    border-radius: 8px;
  }
  label.check:hover { background: var(--accent-soft); }
  label.check input {
    width: 17px;
    height: 17px;
    flex-shrink: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* ------------------------------------------------------- Tri-state task row
     Single real control per task (grid: control, icon, flexible name,
     trailing weight+result group) that cycles off -> on (dynamic) ->
     on (fixed rotation) -> off. See cycleTaskState()/setTaskState(). */
  .task-row {
    display: grid;
    grid-template-columns: 26px 22px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 10px 6px;
    border-bottom: 1px solid var(--border);
    border-radius: 10px;
    box-sizing: border-box;
  }
  .task-row:last-child { border-bottom: none; }

  /* Explains the tri-state task checkbox (off / on / fixed-rotation) right
     above the task list, so the cycling behavior isn't a surprise. */
  .tri-legend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    margin: -4px 0 12px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .tri-legend span {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tri-legend-dot {
    width: 13px;
    height: 13px;
    border-radius: 4px;
    border: 1.5px solid var(--border, var(--muted));
    display: inline-block;
    flex-shrink: 0;
  }
  .tri-legend-dot.off { background: transparent; }
  .tri-legend-dot.on { background: var(--accent); border-color: var(--accent); }
  .tri-legend-dot.fixed { background: var(--rotation-accent); border-color: var(--rotation-accent); }
  .tri-legend-hint { font-style: italic; }
  @media (max-width: 600px) {
    .tri-legend { gap: 10px 14px; }
  }

  /* Live, client-side-only preview: this task is set to fixed rotation
     AND today's weekday actually has someone in FIXED_SCHEDULES locally.
     Removed again if the server later reports a fallback for this task
     (see renderRotationFallbackNotice / onAssignClicked). */
  .task-row.rotation-live-ok {
    border: 2px solid var(--rotation-accent);
    padding: 8px 5px;
  }

  .tri-control {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .tri-control input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    /* Same color for every task's "on" state, matching the legend above
       the list -- per-task color is reserved for the name/icon/weight
       chip, not the checkbox itself, so the checkbox's color always
       means the same thing (on vs. fixed) at a glance. */
    accent-color: var(--accent);
  }
  .task-row.tri-fixed .tri-control input[type="checkbox"] {
    accent-color: var(--rotation-accent);
  }

  .task-icon {
    font-size: 1.05rem;
    line-height: 1;
    flex-shrink: 0;
    width: 1.3em;
    text-align: center;
  }

  .task-row .name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 0.94rem;
    min-width: 0;
  }
  .task-row.tri-fixed .name {
    color: var(--rotation-accent);
    font-weight: 600;
  }
  .task-row.tri-fixed .name::before {
    content: "\1F501 "; /* 🔁 */
  }

  .task-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .weight-chip {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 6px;
    padding: 2px 6px;
    flex-shrink: 0;
  }
  /* Passive hint: this task has someone covering today in the LOCAL
     config, shown regardless of the control's current state so the
     option is visible before the user even clicks. Hidden once the
     task is actually in the fixed state, since the colored 🔁 name
     prefix already carries that signal at that point -- showing both
     would be redundant. */
  .rotation-hint-badge {
    font-size: 0.85rem;
    line-height: 1;
    opacity: 0.55;
    flex-shrink: 0;
  }
  .task-row.tri-fixed .rotation-hint-badge {
    display: none;
  }
  .result-box {
    font-size: 0.9rem;
    padding: 4px 8px;
    border-radius: 8px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 140px;
  }
  .result-box.filled {
    color: var(--accent);
    font-weight: 600;
    background: var(--accent-soft);
  }

  /* Below 600px, stack each row so neither the task name nor the result
     gets truncated. */
  @media (max-width: 600px) {
    .task-row {
      grid-template-columns: 26px 22px 1fr;
      grid-template-areas:
        "control icon name"
        "meta meta meta";
      row-gap: 6px;
      padding: 10px 6px;
    }
    .tri-control { grid-area: control; }
    .task-icon { grid-area: icon; }
    .task-row .name {
      grid-area: name;
      overflow: visible;
      text-overflow: unset;
      white-space: normal;
      word-break: break-word;
    }
    .task-meta {
      grid-area: meta;
      justify-content: flex-start;
    }
    .result-box {
      overflow: visible;
      text-overflow: unset;
      white-space: normal;
      word-break: break-word;
      max-width: none;
    }
  }

  footer.actions {
    margin-top: 18px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  button.primary, button.secondary {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.92rem;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    cursor: pointer;
  }
  button.primary {
    background: var(--btn-bg);
    color: var(--btn-fg);
  }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.secondary:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }

  #status {
    font-size: 0.85rem;
    color: var(--muted);
  }
  #status.ok { color: var(--success); }
  #status.err { color: var(--danger); }
  #status.info { color: var(--accent); }

  #staleNotice {
    display: none;
    margin-bottom: 14px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    cursor: pointer;
  }
  #staleNotice.show { display: block; }

  #notifyAnywayBtn {
    display: none;
  }
  #notifyAnywayBtn.show {
    display: inline-block;
  }

  #rotationFallbackNotice {
    display: none;
    margin-bottom: 14px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--rotation-accent);
    background: var(--rotation-accent-soft);
    border: 1px solid var(--rotation-accent);
  }
  #rotationFallbackNotice.show { display: block; }

  label.check.fixed-locked {
    opacity: 0.6;
  }
  label.check.fixed-locked input[type="checkbox"] {
    cursor: not-allowed;
  }

  /* ---------------------------------------------------------- Today's Assignments */
  .today-panel { margin-top: 20px; }
  .hint {
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--muted);
    margin-left: 4px;
  }
  .today-slider {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    padding: 4px 2px 10px;
    -webkit-overflow-scrolling: touch;
  }
  .today-slider::-webkit-scrollbar { height: 8px; }
  .today-slider::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  .today-card {
    flex: 0 0 auto;
    scroll-snap-align: start;
    width: min(340px, 85vw);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .today-card-time {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .today-card-warning {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--rotation-accent);
    background: var(--rotation-accent-soft);
    border: 1px solid var(--rotation-accent);
    border-radius: 8px;
    padding: 6px 9px;
    margin-bottom: 10px;
  }
  .today-card-person {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.95rem;
    margin: 10px 0 4px;
  }
  .today-card-person:first-of-type { margin-top: 0; }
  .today-card-task {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    padding: 2px 0;
  }
  .today-card-task .weight {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--muted);
  }
  .today-empty {
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="staleNotice" role="button" tabindex="0">
    The people/task configuration was updated since this page loaded &mdash; click here to reload with the latest.
  </div>

  <div id="rotationFallbackNotice"></div>


  <header class="top">
    <div class="brand">
      <img src="taskAssigner_icon.png" alt="">
      <h1>Task Assigner</h1>
    </div>
    <div class="theme-toggle">
      <span>Theme</span>
      <button id="themeBtn" type="button">Toggle</button>
    </div>
  </header>

  <div class="grid">
    <section class="panel">
      <h2>People</h2>
      <div id="peopleList"></div>
    </section>

    <section class="panel">
      <h2>Tasks &nbsp;/&nbsp; Assigned to</h2>
      <div class="tri-legend">
        <span><span class="tri-legend-dot off"></span>Off — excluded</span>
        <span><span class="tri-legend-dot on"></span>On — random pool</span>
        <span><span class="tri-legend-dot fixed"></span>Fixed rotation today</span>
        <span class="tri-legend-hint">Click a task's checkbox to cycle through states</span>
      </div>
      <div id="taskList"></div>
    </section>
  </div>

  <footer class="actions">
    <button class="primary" id="assignBtn" type="button">Assign</button>
    <button class="secondary" id="notifyAnywayBtn" type="button">Notify group anyway</button>
    <span id="status"></span>
  </footer>

  <section class="panel today-panel" id="todaySection" style="display:none;">
    <h2>Today's Assignments <span id="todayCount" class="hint"></span></h2>
    <div id="todaySlider" class="today-slider"></div>
  </section>

</div>

<script>
/* =============================================================================
   PEOPLE, TASKS, TASK_COLORS, and FIXED_SCHEDULES are no longer hardcoded
   here -- they're fetched from the Worker's central config (see
   worker/config.js), which is edited via admin.html. This is populated by
   init() below, before anything else runs. Only WORKER_URL and the a few
   local-only settings stay as plain constants.
   ============================================================================= */

let PEOPLE = [];
let TASKS = [];
let TASK_COLORS = {};
let FIXED_SCHEDULES = {};


// The Cloudflare Worker URL from `wrangler deploy` (see README.md).
// This is safe to be public -- it's just an address, not a secret. The
// actual bot token lives server-side in the Worker's environment, never
// here.
// const WORKER_URL = "https://REPLACE-ME.workers.dev";
const WORKER_URL = "https://task-assigner-telegram.mehra-co.workers.dev";

const DEFAULT_DARK_MODE = true;
const CONFIG_STORAGE_KEY = "taskAssignerConfig";

/* ============================================================================= */

let isDark = DEFAULT_DARK_MODE;

// --------------------------------------------------------------------- Config
function buildDefaultConfig() {
  return {
    darkMode: DEFAULT_DARK_MODE,
    people: PEOPLE.map(p => ({ name: p.name, enabled: p.defaultEnabled })),
    tasks: TASKS.map(t => ({
      name: t.name,
      enabled: t.defaultEnabled,
      weight: t.weight,
      // Only meaningful for a task that has a fixed schedule; its default
      // comes from that task's admin-configured "use in automated run"
      // setting. Irrelevant/unused otherwise.
      useFixedRotation: FIXED_SCHEDULES[t.name] ? !!t.useInAutomatedRotation : false,
    })),
  };
}

function configIsValid(cfg) {
  if (!cfg || typeof cfg !== "object") return false;
  if (!Array.isArray(cfg.people) || !Array.isArray(cfg.tasks)) return false;
  if (typeof cfg.darkMode !== "boolean") return false;
  if (cfg.people.length !== PEOPLE.length || cfg.tasks.length !== TASKS.length) return false;
  for (let i = 0; i < PEOPLE.length; i++) {
    const p = cfg.people[i];
    if (!p || p.name !== PEOPLE[i].name || typeof p.enabled !== "boolean") return false;
  }
  for (let i = 0; i < TASKS.length; i++) {
    const t = cfg.tasks[i];
    if (!t || t.name !== TASKS[i].name || typeof t.enabled !== "boolean") return false;
    if (typeof t.weight !== "number" || !(t.weight > 0)) return false;
    if (typeof t.useFixedRotation !== "boolean") return false;
  }
  return true;
}

function loadOrInitConfig() {
  let cfg = null;
  try {
    const raw = localStorage.getItem(CONFIG_STORAGE_KEY);
    if (raw) cfg = JSON.parse(raw);
  } catch (e) {
    cfg = null;
  }
  if (!configIsValid(cfg)) {
    cfg = buildDefaultConfig();
    saveConfig(cfg);
  }
  return cfg;
}

function saveConfig(cfg) {
  try {
    localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify(cfg));
  } catch (e) {
    // Non-fatal (e.g. private browsing mode blocking storage) -- the
    // app still works, it just won't remember state next time.
  }
}

function currentConfigFromUI() {
  return {
    darkMode: isDark,
    people: PEOPLE.map((p, i) => {
      const isLocked = personChecks[i].disabled;
      const enabled = isLocked
        ? (fixedLockedPersonPriorState[p.name] ?? personChecks[i].checked)
        : personChecks[i].checked;
      return { name: p.name, enabled };
    }),
    tasks: TASKS.map((t, i) => {
      // The control's `.checked` is only a same-day preview once the task
      // is in "fixed" state (true only when someone actually covers today
      // locally -- see applyFixedRotationUI) -- it is NOT whether the task
      // participates at all. Participation is the tri-state itself: "off"
      // means excluded, "on"/"fixed" both mean included (fixed just also
      // asks the server to prefer the rotation for it).
      const state = taskRowEls[i].dataset.state;
      return {
        name: t.name,
        enabled: state !== "off",
        weight: taskWeights[i],
        useFixedRotation: state === "fixed",
      };
    }),
  };
}

function persistCurrentConfig() {
  saveConfig(currentConfigFromUI());
}

// --------------------------------------------------------------------- Build UI
// config/taskWeights are populated inside init() below, once PEOPLE/TASKS
// have actually been fetched from the server. Rotation state now lives
// per-task as taskRowEls[i].dataset.state ("off"|"on"|"fixed"), driven by
// a single real checkbox (taskChecks[i]) -- see buildTaskList/cycleTaskState.
let config = null;
let taskWeights = [];

function tehranWeekdayName(date) {
  return new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Tehran", weekday: "long" }).format(date);
}

const personChecks = [];
const personRowEls = [];
const taskChecks = []; // one real checkbox per task, driving the tri-state cycle via taskRowEls[i].dataset.state
const resultBoxes = [];
const taskRowEls = [];

// Remembers each fixed-rotation person's REAL checkbox preference while
// their checkbox is forced on/locked -- without this, persisting config
// while they're locked would overwrite their true preference with the
// temporary forced value. Populated/cleared in applyFixedRotationUI.
let fixedLockedPersonPriorState = {};

function buildPeopleList() {
  const container = document.getElementById("peopleList");
  PEOPLE.forEach((p, i) => {
    const label = document.createElement("label");
    label.className = "check";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = config.people[i].enabled;
    input.addEventListener("change", persistCurrentConfig);
    const span = document.createElement("span");
    span.textContent = p.name;
    label.appendChild(input);
    label.appendChild(span);
    container.appendChild(label);
    personChecks.push(input);
    personRowEls.push(label); // the label itself is the "row" for people
  });
}

// Cycles task i's single control through off -> on (dynamic) ->
// on (fixed rotation) -> off. The 3rd state only exists for tasks that
// actually have a FIXED_SCHEDULES entry.
function cycleTaskState(i) {
  const row = taskRowEls[i];
  const hasFixed = !!FIXED_SCHEDULES[TASKS[i].name];
  const state = row.dataset.state;
  let next;
  if (state === "off") next = "on";
  else if (state === "on") next = hasFixed ? "fixed" : "off";
  else next = "off";
  setTaskState(i, next);
}

function setTaskState(i, state) {
  const row = taskRowEls[i];
  const input = taskChecks[i];
  row.dataset.state = state;
  input.checked = state !== "off";
  row.classList.toggle("tri-fixed", state === "fixed");
  applyFixedRotationUI();
  persistCurrentConfig();
}

function buildTaskList() {
  const container = document.getElementById("taskList");
  TASKS.forEach((t, i) => {
    const row = document.createElement("div");
    row.className = "task-row";

    const color = TASK_COLORS[t.name] || null;
    const hasFixed = !!FIXED_SCHEDULES[t.name];
    const initialState = (hasFixed && config.tasks[i].useFixedRotation)
      ? "fixed"
      : (config.tasks[i].enabled ? "on" : "off");
    row.dataset.state = initialState;
    if (initialState === "fixed") row.classList.add("tri-fixed");
    if (color) row.style.setProperty("--task-color", color);

    // Whether this task's local schedule actually has someone covering
    // TODAY's weekday -- used to show a passive "this option is available
    // today" hint badge regardless of the control's current state, so the
    // user knows fixed rotation is on the table before they even click.
    const weekday = tehranWeekdayName(new Date());
    const rotationPossibleToday = hasFixed && !!FIXED_SCHEDULES[t.name][weekday];
    if (rotationPossibleToday) row.classList.add("rotation-possible-today");

    const controlLabel = document.createElement("label");
    controlLabel.className = "tri-control";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = initialState !== "off";
    input.addEventListener("click", (e) => {
      // Deliberately NOT calling e.preventDefault() here: per the HTML
      // spec, canceling a checkbox's click restores `.checked` to its
      // PRE-click value right after this listener returns (the
      // "cancelled activation behavior" steps), which would silently
      // stomp over any explicit `.checked` assignment made below inside
      // cycleTaskState/setTaskState -- the exact bug where clicking
      // looked like it did nothing. Letting the native toggle commit
      // first, then overriding `.checked` ourselves afterward (still
      // inside this same handler), is what actually sticks.
      cycleTaskState(i);
    });
    controlLabel.appendChild(input);

    const iconSpan = document.createElement("span");
    iconSpan.className = "task-icon";
    iconSpan.textContent = t.icon || "•";
    if (color) {
      iconSpan.style.background = color + "26"; // ~15% alpha badge
      iconSpan.style.borderRadius = "6px";
    }

    const nameSpan = document.createElement("span");
    nameSpan.className = "name";
    nameSpan.textContent = t.name;
    if (color) nameSpan.style.color = color;

    const meta = document.createElement("div");
    meta.className = "task-meta";
    if (rotationPossibleToday) {
      const hintBadge = document.createElement("span");
      hintBadge.className = "rotation-hint-badge";
      hintBadge.textContent = "\u{1F501}";
      hintBadge.title = "Fixed rotation is available for this task today -- click the checkbox twice to use it";
      meta.appendChild(hintBadge);
    }
    const chip = document.createElement("span");
    chip.className = "weight-chip";
    chip.textContent = "×" + taskWeights[i];
    if (color) {
      chip.style.color = color;
      chip.style.background = color + "22";
    }
    const result = document.createElement("div");
    result.className = "result-box";
    result.textContent = "-- not assigned --";
    meta.appendChild(chip);
    meta.appendChild(result);

    row.appendChild(controlLabel);
    row.appendChild(iconSpan);
    row.appendChild(nameSpan);
    row.appendChild(meta);
    container.appendChild(row);

    taskChecks.push(input);
    resultBoxes.push(result);
    taskRowEls.push(row);
  });
}

// --------------------------------------------------------------- Fixed rotation
// Enforces the mutual exclusion for EVERY task that has a fixed schedule
// entry (not just one hardcoded task): while the rotation is on, each
// such task's own checkbox is locked off (forced unchecked, disabled)
// since there's nothing left for the user to decide about it. Also fills
// in a same-page PREVIEW of who that resolves to today, purely for
// display -- the actual authoritative resolution happens server-side
// when Assign is clicked (see worker/telegram-worker.js).
function applyFixedRotationUI() {
  const weekday = tehranWeekdayName(new Date());

  TASKS.forEach((t, i) => {
    const schedule = FIXED_SCHEDULES[t.name];
    if (!schedule) return; // this task has no fixed schedule -- untouched

    const row = taskRowEls[i];
    const checkbox = taskChecks[i];
    const result = resultBoxes[i];
    const color = TASK_COLORS[t.name] || null;
    const thisTaskWantsRotation = row.dataset.state === "fixed";

    if (thisTaskWantsRotation) {
      const person = schedule[weekday];

      // Reflect reality: checked when someone is actually covering this
      // task today via the rotation, unchecked only when today genuinely
      // has no one assigned (e.g. a day left blank in admin.html). This
      // control IS the tri-state cycle itself, so it must stay clickable
      // here -- disabling it would trap the task in "fixed" forever with
      // no way to click back to "on"/"off". Only the checked flag (a
      // pure visual/preview thing) reflects today's resolution; actual
      // state transitions keep going through cycleTaskState().
      checkbox.checked = !!person;

      // Live, client-side-only red-box preview: fixed state + a local
      // schedule entry for today. Cleared again by the assign-response
      // handler if the server reports this task actually fell back to
      // dynamic assignment (see onAssignClicked / renderRotationFallbackNotice).
      row.classList.toggle("rotation-live-ok", !!person);

      if (person) {
        result.textContent = "\u{1F501} " + person;
        result.classList.add("filled");
        if (color) result.style.color = color;
      } else {
        result.textContent = "no rotation today — will assign randomly";
        result.classList.remove("filled");
        result.style.color = "";
      }
    } else {
      row.classList.remove("rotation-live-ok");
      result.textContent = "-- not assigned --";
      result.classList.remove("filled");
      result.style.color = "";
    }
  });

  // ---- People: force-include and lock whoever today's rotation covers ----
  // This is the fix for the dedupe-bypass bug: if a rotation person's
  // People checkbox could be freely unticked, that changed the day's
  // "configuration" fingerprint and let someone force a fresh reroll by
  // simply excluding them. Locking them ON here closes that off, and also
  // guarantees the "seed their workload" fairness behavior always applies
  // instead of only when the user happened to leave them ticked.
  // Only tasks whose OWN control is in the "fixed" state contribute a
  // locked person.
  const lockedPersonNames = new Set();
  TASKS.forEach((t, i) => {
    const schedule = FIXED_SCHEDULES[t.name];
    if (!schedule) return;
    if (taskRowEls[i].dataset.state !== "fixed") return;
    const person = schedule[weekday];
    if (person) lockedPersonNames.add(person);
  });

  PEOPLE.forEach((p, i) => {
    const checkbox = personChecks[i];
    const row = personRowEls[i];

    if (lockedPersonNames.has(p.name)) {
      if (!(p.name in fixedLockedPersonPriorState)) {
        fixedLockedPersonPriorState[p.name] = checkbox.checked; // remember real preference, once
      }
      checkbox.checked = true;
      checkbox.disabled = true;
      row.classList.add("fixed-locked");
      row.title = "Included today: part of the fixed rotation";
    } else if (checkbox.disabled) {
      // Was locked before, now unlocking -- restore their real preference
      checkbox.checked = fixedLockedPersonPriorState[p.name] ?? checkbox.checked;
      delete fixedLockedPersonPriorState[p.name];
      checkbox.disabled = false;
      row.classList.remove("fixed-locked");
      row.title = "";
    }
  });
}

// --------------------------------------------------------------------- Theming
function applyTheme() {
  document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
}
document.getElementById("themeBtn").addEventListener("click", () => {
  isDark = !isDark;
  applyTheme();
  persistCurrentConfig();
});
// Apply a reasonable default theme immediately, so the page doesn't flash
// the wrong theme while waiting on the config fetch below -- init() will
// correct it to the real saved preference once loaded.
isDark = DEFAULT_DARK_MODE;
applyTheme();

// --------------------------------------------------------------------- Init
// Fetches the central config from the Worker (people, tasks, colors,
// icons, fixed rotation) BEFORE building anything -- this is what
// replaces the old hardcoded PEOPLE/TASKS/FIXED_SCHEDULES arrays. See
// worker/config.js and admin.html for where this data actually lives and
// how it's edited.
//
// Stale-while-revalidate: if a previous visit's config is cached in
// localStorage, render from it IMMEDIATELY (no network wait at all) and
// refresh the cache silently in the background for next time. This never
// touches the already-rendered UI mid-session -- a background refresh
// only updates what's used on the NEXT load, so it can't yank a
// checkbox out from under someone mid-interaction. First-ever visit (no
// cache yet) falls back to waiting on the network, same as before.
const SERVER_CONFIG_CACHE_KEY = "taskAssignerServerConfigCache";

function readCachedServerConfig() {
  try {
    const raw = localStorage.getItem(SERVER_CONFIG_CACHE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.people) || !Array.isArray(parsed.tasks)) return null;
    return parsed;
  } catch (e) {
    return null;
  }
}

function writeCachedServerConfig(serverCfg) {
  try {
    localStorage.setItem(SERVER_CONFIG_CACHE_KEY, JSON.stringify(serverCfg));
  } catch (e) {
    // Non-fatal (e.g. private browsing) -- just means next load waits on
    // the network again instead of rendering instantly from cache.
  }
}

async function fetchServerConfig() {
  const resp = await fetch(WORKER_URL + "/config");
  if (!resp.ok) throw new Error("Failed to load configuration (" + resp.status + ")");
  return await resp.json();
}

function applyServerConfig(serverCfg) {
  PEOPLE = (serverCfg.people || []).map(p => ({ name: p.name, defaultEnabled: p.defaultEnabled }));
  TASKS = (serverCfg.tasks || []).map(t => ({
    name: t.name, weight: t.weight, defaultEnabled: t.defaultEnabled, icon: t.icon,
    useInAutomatedRotation: !!t.useInAutomatedRotation,
  }));
  TASK_COLORS = {};
  (serverCfg.tasks || []).forEach(t => { if (t.color) TASK_COLORS[t.name] = t.color; });
  FIXED_SCHEDULES = serverCfg.fixedSchedules || {};
  return PEOPLE.length > 0 && TASKS.length > 0;
}

function buildUIFromCurrentConfig() {
  config = loadOrInitConfig();
  isDark = config.darkMode;
  taskWeights = TASKS.map((t, i) => config.tasks[i].weight);

  buildPeopleList();
  buildTaskList();
  applyFixedRotationUI();
  applyTheme();
}

async function init() {
  const assignBtn = document.getElementById("assignBtn");
  assignBtn.disabled = true;

  if (WORKER_URL.includes("REPLACE-ME")) {
    setStatus("Set WORKER_URL in index.html first (see README).", "err");
    return;
  }

  const cached = readCachedServerConfig();
  if (cached && applyServerConfig(cached)) {
    // Instant render from cache -- no network wait for this page view.
    buildUIFromCurrentConfig();
    assignBtn.disabled = false;
    setStatus("", "");

    // Refresh silently in the background for NEXT load. Deliberately
    // does not touch PEOPLE/TASKS/the live DOM again this session.
    fetchServerConfig().then((fresh) => {
      writeCachedServerConfig(fresh);
      // If the fresh copy differs from what this page rendered from,
      // say so instead of silently showing stale data. The live UI is
      // deliberately NOT rebuilt mid-session (that could yank a checkbox
      // from under someone mid-selection) -- the user chooses when to reload.
      if (fresh && cached && fresh.updatedAt && fresh.updatedAt !== cached.updatedAt) {
        const notice = document.getElementById("staleNotice");
        notice.classList.add("show");
        notice.addEventListener("click", () => location.reload());
      }
    }).catch(() => {
      // Non-fatal -- next load just tries the network again.
    });
    return;
  }

  // No usable cache yet (first-ever visit, or private browsing) -- fall
  // back to waiting on the network before rendering anything.
  setStatus("Loading configuration…", "info");
  let serverCfg;
  try {
    serverCfg = await fetchServerConfig();
  } catch (err) {
    setStatus("Could not load configuration: " + err.message, "err");
    return;
  }

  if (!applyServerConfig(serverCfg)) {
    setStatus("Server returned an empty configuration -- check admin.html.", "err");
    return;
  }
  writeCachedServerConfig(serverCfg);

  buildUIFromCurrentConfig();

  setStatus("", "");
  assignBtn.disabled = false;
}

// --------------------------------------------------------------------- Today's Assignments slider
// Shows every combination already generated today (manual clicks AND the
// automated run) -- plain HTML/CSS cards, not images, so emoji render
// natively and nothing needs to be re-rendered or stored server-side
// beyond what's already in KV for the dedupe logic.
function esc(s) {
  const d = document.createElement("div");
  d.textContent = String(s);
  return d.innerHTML;
}

function buildTodayCard(record) {
  const card = document.createElement("div");
  card.className = "today-card";

  const time = document.createElement("div");
  time.className = "today-card-time";
  time.textContent = formatTehranTime(record.generatedAt);
  card.appendChild(time);

  if (record.rotationFallbackTasks && record.rotationFallbackTasks.length > 0) {
    const warn = document.createElement("div");
    warn.className = "today-card-warning";
    warn.textContent = "⚠ No fixed rotation set for today: " + record.rotationFallbackTasks.join(", ");
    card.appendChild(warn);
  }

  const byPerson = new Map();
  (record.assignment || []).forEach((a) => {
    if (!byPerson.has(a.person)) byPerson.set(a.person, []);
    byPerson.get(a.person).push(a);
  });

  byPerson.forEach((tasks, person) => {
    const personEl = document.createElement("div");
    personEl.className = "today-card-person";
    personEl.textContent = person;
    card.appendChild(personEl);

    tasks.forEach((t) => {
      const row = document.createElement("div");
      row.className = "today-card-task";
      row.style.color = t.color || "inherit";
      row.innerHTML =
        (t.fixed ? "🔁 " : "") +
        (t.icon ? esc(t.icon) + " " : "") +
        `<span>${esc(t.task)}</span>` +
        (typeof t.weight === "number" ? `<span class="weight">×${t.weight}</span>` : "");
      card.appendChild(row);
    });
  });

  return card;
}

async function loadTodaySlider() {
  const section = document.getElementById("todaySection");
  const slider = document.getElementById("todaySlider");
  const count = document.getElementById("todayCount");
  try {
    const resp = await fetch(WORKER_URL + "/today");
    if (!resp.ok) return; // non-fatal -- the main app still works without this
    const data = await resp.json();
    const results = data.results || [];

    slider.innerHTML = "";
    if (results.length === 0) {
      section.style.display = "none";
      return;
    }
    count.textContent = `(${results.length})`;
    results.forEach((record) => slider.appendChild(buildTodayCard(record)));
    section.style.display = "";
  } catch (err) {
    // Non-fatal -- the slider is a nice-to-have, never blocks the main app.
  }
}

init();
loadTodaySlider();

// --------------------------------------------------------------------- Algorithm
// NOTE: the actual weighted-balancing algorithm now runs on the SERVER
// (the Worker), not here. This keeps randomness out of the client's

// hands entirely -- the browser only ever sends the current
// configuration (who/what is ticked) and displays whatever the server
// decides, whether that's a freshly generated assignment or an already-
// existing one for today (Tehran time).

let lastServerResult = null; // { status, assignment, generatedAt, tehranDate }

function clearResultBoxes() {
  resultBoxes.forEach(box => {
    box.textContent = "-- not assigned --";
    box.classList.remove("filled");
    box.style.color = "";
  });
}

function renderAssignment(assignment) {
  clearResultBoxes();
  const byTask = new Map(assignment.map(r => [r.task, r]));
  TASKS.forEach((t, i) => {
    const entry = byTask.get(t.name);
    if (entry) {
      // A leading 🔁 marks a task that was actually covered by its fixed
      // rotation today (matches the same symbol used in the Telegram
      // card and next to each task's own rotation checkbox above) --
      // mirrors the server's `fixed` flag exactly, so a task that fell
      // back to a random pick (no schedule for today) correctly shows
      // with NO badge here, same as the server-side warning banner.
      resultBoxes[i].textContent = (entry.fixed ? "\u{1F501} " : "") + entry.person;
      resultBoxes[i].classList.add("filled");
      resultBoxes[i].classList.toggle("fixed-result", !!entry.fixed);
      const color = TASK_COLORS[t.name];
      if (color) resultBoxes[i].style.color = color;
    }
  });
}

function renderRotationFallbackNotice(rotationFallbackTasks) {
  const el = document.getElementById("rotationFallbackNotice");
  if (rotationFallbackTasks && rotationFallbackTasks.length > 0) {
    el.textContent = "⚠ No fixed rotation set for today for: " +
      rotationFallbackTasks.join(", ") + " — assigned randomly instead.";
    el.classList.add("show");
  } else {
    el.classList.remove("show");
  }
}

// Snapshot of which tasks are in the 3rd ("fixed rotation") control state
// at the moment Assign/Notify is clicked -- used by
// applyManualRotationFallbackResult below for condition (d).
function fixedStateTaskNamesSnapshot() {
  const set = new Set();
  TASKS.forEach((t, i) => {
    if (taskRowEls[i].dataset.state === "fixed") set.add(t.name);
  });
  return set;
}

// Narrows the server's raw `rotationFallbackTasks` down to the tasks that
// should actually surface the "no fixed rotation assigned" warning on
// THIS (manual, button-triggered) response. This is only ever called from
// onAssignClicked/onNotifyAnywayClicked -- never from the /today slider
// (buildTodayCard), which still shows the server's raw list as-is for
// every record including automated runs, so this scoping never touches
// that surface (condition a).
//
// A task's warning is shown only when ALL of:
//   (b) the local FIXED_SCHEDULES entry for this task has someone
//       scheduled for today's weekday,
//   (c) the server nonetheless did NOT assign it via fixed rotation
//       today (it's present in rotationFallbackTasks -- true by
//       construction, since we're filtering that exact list),
//   (d) the task's control was actually in the 3rd ("fixed rotation")
//       state when Assign was clicked.
// Any task that fails this also has its live red-box preview
// (.rotation-live-ok) cleared, since that preview is now known stale.
function applyManualRotationFallbackResult(rotationFallbackTasks, fixedSelectedAtSubmit) {
  const weekday = tehranWeekdayName(new Date());
  const toShow = [];
  (rotationFallbackTasks || []).forEach((taskName) => {
    const i = TASKS.findIndex(t => t.name === taskName);
    if (i === -1) return;
    if (!fixedSelectedAtSubmit.has(taskName)) return; // (d)
    const schedule = FIXED_SCHEDULES[taskName];
    if (!schedule || !schedule[weekday]) return; // (b)
    toShow.push(taskName); // (c) already holds -- it's in rotationFallbackTasks
    taskRowEls[i].classList.remove("rotation-live-ok");
  });
  renderRotationFallbackNotice(toShow);
}

function formatTehranTime(isoString) {
  try {
    return new Date(isoString).toLocaleTimeString("en-GB", {
      timeZone: "Asia/Tehran", hour: "2-digit", minute: "2-digit",
    });
  } catch (e) {
    return isoString;
  }
}

async function callAssignEndpoint(forceNotify) {
  const enabledPeopleNames = PEOPLE
    .map((p, i) => ({ name: p.name, enabled: personChecks[i].checked }))
    .filter(p => p.enabled)
    .map(p => p.name);

  const enabledTasksPayload = TASKS.map((t, i) => ({
    name: t.name,
    weight: taskWeights[i],
    enabled: taskChecks[i].checked,
    useFixedRotation: taskRowEls[i].dataset.state === "fixed",
  }));

  if (enabledPeopleNames.length === 0) {
    setStatus("Select at least one person.", "err");
    return null;
  }
  if (!enabledTasksPayload.some(t => t.enabled)) {
    setStatus("Select at least one task.", "err");
    return null;
  }
  if (WORKER_URL.includes("REPLACE-ME")) {
    setStatus("Set WORKER_URL in index.html first (see README).", "err");
    return null;
  }

  const payload = {
    people: PEOPLE.map((p, i) => ({ name: p.name, enabled: personChecks[i].checked })),
    tasks: enabledTasksPayload,
    forceNotify: !!forceNotify,
  };

  const resp = await fetch(WORKER_URL + "/assign", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  const data = await resp.json();
  if (!resp.ok) {
    throw new Error(data.error || ("Request failed: " + resp.status));
  }
  return data;
}

async function onAssignClicked() {
  const assignBtn = document.getElementById("assignBtn");
  const notifyBtn = document.getElementById("notifyAnywayBtn");
  notifyBtn.classList.remove("show");
  renderRotationFallbackNotice(null);
  assignBtn.disabled = true;
  setStatus("Checking today's assignments…", "info");

  const fixedSnapshot = fixedStateTaskNamesSnapshot();
  try {
    const data = await callAssignEndpoint(false);
    if (!data) { assignBtn.disabled = false; return; }

    lastServerResult = data;
    renderAssignment(data.assignment);
    applyManualRotationFallbackResult(data.rotationFallbackTasks, fixedSnapshot);
    loadTodaySlider();

    if (data.status === "new") {
      setStatus("New assignment generated and sent to the group.", "ok");
    } else if (data.status === "repeat") {
      const when = formatTehranTime(data.generatedAt);
      setStatus(
        `This exact combination was already assigned today at ${when} (Tehran time) -- showing that result. Not sent again.`,
        "info"
      );
      notifyBtn.classList.add("show");
    }
  } catch (err) {
    setStatus("Failed: " + err.message, "err");
  } finally {
    assignBtn.disabled = false;
  }
}

async function onNotifyAnywayClicked() {
  const notifyBtn = document.getElementById("notifyAnywayBtn");
  notifyBtn.disabled = true;
  setStatus("Posting reminder to the group…", "info");
  const fixedSnapshot = fixedStateTaskNamesSnapshot();
  try {
    const data = await callAssignEndpoint(true);
    if (!data) { notifyBtn.disabled = false; return; }
    lastServerResult = data;
    renderAssignment(data.assignment);
    applyManualRotationFallbackResult(data.rotationFallbackTasks, fixedSnapshot);
    setStatus("Reminder posted to the group.", "ok");
    notifyBtn.classList.remove("show");
  } catch (err) {
    setStatus("Failed: " + err.message, "err");
  } finally {
    notifyBtn.disabled = false;
  }
}

document.getElementById("assignBtn").addEventListener("click", onAssignClicked);
document.getElementById("notifyAnywayBtn").addEventListener("click", onNotifyAnywayClicked);

function setStatus(msg, kind) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = kind || "";
}
</script>
